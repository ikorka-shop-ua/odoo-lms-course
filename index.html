<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Курс новачка — Ikorka Shop</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1c2b2d; --ink-soft:#4b5d5f; --bg:#f6f4ee; --panel:#ffffff;
    --line:#e3ded2; --teal:#c32119; --teal-dark:#961a14; --amber:#fe8b26;
    --ok:#3c7a5c; --bad:#b3462c; --radius:10px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;}
  header{
    background:var(--teal); color:#fff; padding:18px 20px;
    display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10;
  }
  header .brand{font-weight:700; font-size:17px;}
  header .brand small{display:block; font-weight:400; font-size:12px; opacity:0.75; margin-top:2px;}
  header .user{font-size:13px; opacity:0.9; display:flex; align-items:center; gap:10px;}
  header .user button{
    background:transparent; border:1px solid rgba(255,255,255,0.4); color:#fff;
    border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer;
  }
  main{max-width:760px; margin:0 auto; padding:24px 18px 80px;}
  .login-wrap{min-height:80vh; display:flex; align-items:center; justify-content:center;}
  .login-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:36px 32px; max-width:380px; width:100%; text-align:center;
  }
  .login-card h1{font-size:20px; margin:0 0 6px;}
  .login-card p{color:var(--ink-soft); font-size:14px; margin:0 0 22px;}
  .login-card input{
    width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:8px;
    font-size:15px; margin-bottom:14px;
  }
  .login-card button{
    width:100%; padding:12px; background:var(--teal); color:#fff; border:none;
    border-radius:8px; font-size:15px; font-weight:600; cursor:pointer;
  }
  .login-card button:hover{background:var(--teal-dark);}
  .crumbs{font-size:12px; color:var(--ink-soft); margin-bottom:4px;}
  .card-item{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px; margin-bottom:16px; cursor:pointer; transition:border-color .15s;
  }
  .card-item:hover{border-color:var(--teal);}
  .card-item .num{font-size:12px; letter-spacing:1px; color:var(--amber); font-weight:700; text-transform:uppercase;}
  .card-item h2{margin:6px 0 8px; font-size:19px;}
  .card-item p{color:var(--ink-soft); font-size:14px; margin:0 0 14px; line-height:1.5;}
  .progress-bar{height:6px; background:var(--line); border-radius:4px; overflow:hidden;}
  .progress-bar > div{height:100%; background:var(--ok);}
  .progress-label{font-size:12px; color:var(--ink-soft); margin-top:6px;}
  .back-link{
    display:inline-flex; align-items:center; gap:6px; color:var(--ink-soft); font-size:13px;
    text-decoration:none; margin-bottom:18px; cursor:pointer; border:none; background:none; padding:0;
  }
  .lesson-row{
    display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:14px 16px; margin-bottom:10px; cursor:pointer;
  }
  .lesson-row:hover{border-color:var(--teal);}
  .lesson-check{
    width:26px; height:26px; border-radius:50%; border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--ink-soft); flex-shrink:0;
  }
  .lesson-check.done{background:var(--ok); border-color:var(--ok); color:#fff;}
  .lesson-title{font-size:15px; font-weight:500;}
  .lesson-header{margin-bottom:18px;}
  .lesson-header .eyebrow{font-size:12px; color:var(--amber); font-weight:700; letter-spacing:0.5px; text-transform:uppercase;}
  .lesson-header h1{font-size:24px; margin:6px 0 0;}
  .block-text{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:24px; font-size:15px; line-height:1.7; white-space:pre-wrap; margin-bottom:16px;
  }
  .block-text ul, .block-text ol{padding-left:24px; margin:8px 0;}
  .block-text li{margin-bottom:4px;}
  .block-image{margin-bottom:16px; text-align:center;}
  .block-image img{
    width:auto; max-width:100%; max-height:600px; object-fit:contain; border-radius:var(--radius);
    border:1px solid var(--line); cursor:pointer; display:inline-block;
  }
  .block-image .caption{font-size:13px; color:var(--ink-soft); margin-top:6px; text-align:center;}
  .block-video, .block-audio{margin-bottom:16px;}
  .block-file{margin-bottom:16px;}
  .block-file a{
    display:inline-flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line);
    border-radius:8px; padding:12px 16px; color:var(--teal); font-weight:600; text-decoration:none; font-size:14px;
  }
  .block-file a:hover{border-color:var(--teal);}
  .block-quiz{margin-bottom:16px;}
  .quiz-block-title{
    font-size:16px; font-weight:700; color:var(--teal); margin:0 0 12px;
    padding-bottom:8px; border-bottom:2px solid var(--line);
  }
  .quiz-question{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:20px; margin-bottom:12px;
  }
  .quiz-q-text{font-size:15px; font-weight:600; margin-bottom:12px;}
  .quiz-points{font-size:12px; font-weight:400; color:var(--amber);}
  .quiz-answers{display:flex; flex-direction:column; gap:8px;}
  .quiz-answer{
    display:flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid var(--line);
    border-radius:8px; font-size:14px; cursor:pointer;
  }
  .quiz-answer input[type=radio]{flex-shrink:0;}
  .quiz-answer.correct{border-color:var(--ok); background:#eaf4ee;}
  .quiz-answer.wrong{border-color:var(--bad); background:#fbeae6;}
  .quiz-answer.correct-highlight{border-color:var(--ok); background:#eaf4ee;}
  .quiz-feedback{font-size:13px; font-weight:600; margin-top:10px;}
  .quiz-feedback.ok{color:var(--ok);}
  .quiz-feedback.bad{color:var(--bad);}
  .tasks{margin-bottom:24px;}
  .task{
    background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--amber);
    border-radius:8px; padding:16px 18px; margin-bottom:10px;
  }
  .task.self_check{border-left-color:#6b7fd7;}
  .task.practical{border-left-color:var(--amber);}
  .task.homework{border-left-color:#a15fc9;}
  .task .tag{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--ink-soft); margin-bottom:6px; display:block;
  }
  .task p{margin:0 0 10px; font-size:14px; line-height:1.6; white-space:pre-wrap;}
  .task label{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); cursor:pointer;}
  .lesson-nav{display:flex; justify-content:space-between; gap:10px; margin-top:24px;}
  .lesson-nav button{
    flex:1; padding:14px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel); font-size:14px; cursor:pointer;
  }
  .lesson-nav button.primary{background:var(--teal); color:#fff; border-color:var(--teal); font-weight:600;}
  .lesson-nav button:disabled{opacity:0.4; cursor:default;}
  .loading, .empty{text-align:center; color:var(--ink-soft); padding:60px 20px; font-size:14px;}
</style>
</head>
<body>

<header>
  <div class="brand">Курс новачка<small>Ikorka Shop</small></div>
  <div style="display:flex;align-items:center;gap:12px;">
    <a href="https://lyizacarenko-spec.github.io/caviar-manager/" target="_blank" rel="noopener"
      style="background:transparent;border:1px solid rgba(255,255,255,0.5);color:#fff;border-radius:6px;padding:7px 14px;font-size:13px;text-decoration:none;font-weight:600;">
      🐟 Помічник менеджера
    </a>
    <div class="user" id="userBar" style="display:none;">
      <span id="userName"></span>
      <button onclick="logout()">Вийти</button>
    </div>
  </div>
</header>

<main id="app"></main>

<script>
const SUPABASE_URL = "https://yctzcbaynycuibkqmwqd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_pBkmNRVX61ELGcs1HqGV-Q_kBrVJWQA";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const app = document.getElementById('app');
const userBar = document.getElementById('userBar');
const userNameEl = document.getElementById('userName');

const CANDIDATE_KEY = 'ikorka_lms_candidate';

let state = {
  user: null,
  userName: null,
  departments: [],
  courses: {},
  lessons: {},
  tasks: {},
  progress: {},
  taskDone: {},
  quizResults: {},   // lesson_id -> { question_id -> {selected_answer_id, is_correct, points_earned} }
  currentDepartment: null,
  currentCourse: null,
  currentLessonIdx: 0
};

function logout(){
  try { localStorage.removeItem(CANDIDATE_KEY); } catch(e){}
  state.user = null; state.userName = null;
  state.currentDepartment = null; state.currentCourse = null; state.currentLessonIdx = 0;
  state.departments = []; state.progress = {}; state.taskDone = {}; state.quizResults = {};
  render();
}

async function loadDepartments(){
  const { data, error } = await sb.from('departments').select('*').eq('is_active', true).order('order_index');
  if (error) { console.error(error); return; }
  state.departments = data;
}
async function loadCourses(deptId){
  if (state.courses[deptId]) return state.courses[deptId];
  const { data, error } = await sb.from('courses').select('*').eq('department_id', deptId).eq('is_active', true).order('order_index');
  if (error) { console.error(error); return []; }
  state.courses[deptId] = data;
  return data;
}
async function loadLessons(courseId){
  if (state.lessons[courseId]) return state.lessons[courseId];
  const { data, error } = await sb.from('lessons').select('*').eq('course_id', courseId).order('order_index');
  if (error) { console.error(error); return []; }
  state.lessons[courseId] = data;
  return data;
}
async function loadTasks(lessonId){
  if (state.tasks[lessonId]) return state.tasks[lessonId];
  const { data, error } = await sb.from('lesson_tasks').select('*').eq('lesson_id', lessonId).order('order_index');
  if (error) { console.error(error); return []; }
  state.tasks[lessonId] = data;
  return data;
}
async function loadProgress(){
  if (!state.user) return;
  const { data, error } = await sb.from('user_progress').select('*').eq('user_identifier', state.user);
  if (error) { console.error(error); return; }
  data.forEach(p => state.progress[p.lesson_id] = p.status);
  const { data: tc, error: e2 } = await sb.from('task_completion').select('*').eq('user_identifier', state.user);
  if (e2) { console.error(e2); return; }
  tc.forEach(t => state.taskDone[t.task_id] = t.is_done);
}
async function loadQuizResults(lessonId){
  if (state.quizResults[lessonId]) return;
  const { data, error } = await sb.from('quiz_results').select('*').eq('lesson_id', lessonId).eq('user_identifier', state.user);
  if (error) { console.error(error); return; }
  state.quizResults[lessonId] = {};
  data.forEach(r => state.quizResults[lessonId][r.question_id] = r);
}
async function markLessonDone(lessonId){
  state.progress[lessonId] = 'done';
  await sb.from('user_progress').upsert({
    user_identifier: state.user, user_name: state.userName, lesson_id: lessonId, status: 'done', completed_at: new Date().toISOString()
  }, { onConflict: 'user_identifier,lesson_id' });
}
async function markLessonStarted(lessonId){
  if (state.progress[lessonId]) return;
  state.progress[lessonId] = 'in_progress';
  await sb.from('user_progress').upsert({
    user_identifier: state.user, user_name: state.userName, lesson_id: lessonId, status: 'in_progress', started_at: new Date().toISOString()
  }, { onConflict: 'user_identifier,lesson_id' });
}
async function toggleTask(taskId, checked){
  state.taskDone[taskId] = checked;
  await sb.from('task_completion').upsert({
    user_identifier: state.user, user_name: state.userName, task_id: taskId, is_done: checked,
    completed_at: checked ? new Date().toISOString() : null
  }, { onConflict: 'user_identifier,task_id' });
}
async function selectQuizAnswer(lessonId, questionId, answerId, isCorrect, points){
  const pointsEarned = isCorrect ? points : 0;
  await sb.from('quiz_results').upsert({
    user_identifier: state.user,
    user_name: state.userName,
    lesson_id: lessonId,
    question_id: questionId,
    selected_answer_id: answerId,
    is_correct: isCorrect,
    points_earned: pointsEarned,
    points_possible: points,
    answered_at: new Date().toISOString()
  }, { onConflict: 'user_identifier,question_id' });
  if (!state.quizResults[lessonId]) state.quizResults[lessonId] = {};
  state.quizResults[lessonId][questionId] = { selected_answer_id: answerId, is_correct: isCorrect, points_earned: pointsEarned };
  renderLessonPage();
}

function taskTypeLabel(type){
  if (type === 'self_check') return 'Питання на роздум';
  if (type === 'practical') return 'Практика в Odoo';
  if (type === 'homework') return 'Домашнє завдання';
  return type;
}
function getYoutubeId(url){
  if (!url) return null;
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}
function getDriveId(url){
  if (!url) return null;
  const m = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  return m ? m[1] : null;
}
function renderVideoBlock(url){
  if (!url) return '';
  const yid = getYoutubeId(url);
  if (yid) return `<div class="block-video"><iframe width="100%" height="360" style="border-radius:10px;border:none;" src="https://www.youtube.com/embed/${yid}" allowfullscreen></iframe></div>`;
  const did = getDriveId(url);
  if (did) return `<div class="block-video"><iframe width="100%" height="360" style="border-radius:10px;border:none;" src="https://drive.google.com/file/d/${did}/preview" allowfullscreen></iframe></div>`;
  return `<div class="block-video"><video controls style="width:100%;border-radius:10px;"><source src="${url}"></video></div>`;
}
function renderAudioBlock(url){
  if (!url) return '';
  const did = getDriveId(url);
  if (did) return `<div class="block-audio"><iframe width="100%" height="80" style="border:none;" src="https://drive.google.com/file/d/${did}/preview" allow="autoplay"></iframe></div>`;
  return `<div class="block-audio"><audio controls style="width:100%;"><source src="${url}"></audio></div>`;
}
function renderQuizBlock(b, lessonId){
  const results = state.quizResults[lessonId] || {};
  let html = '<div class="block-quiz">';
  if (b.title) html += `<h3 class="quiz-block-title">${b.title}</h3>`;
  (b.questions||[]).forEach(q => {
    const result = results[q.id];
    const answered = !!result;
    html += `<div class="quiz-question">
      <div class="quiz-q-text">${q.text} <span class="quiz-points">(${q.points} б.)</span></div>
      <div class="quiz-answers">`;
    (q.answers||[]).forEach(a => {
      let cls = '';
      if (answered){
        if (a.id === result.selected_answer_id) cls = result.is_correct ? 'correct' : 'wrong';
        else if (a.correct) cls = 'correct-highlight';
      }
      html += `<label class="quiz-answer ${cls}">
        <input type="radio" name="q_${q.id}" ${answered?'disabled':''} ${result && result.selected_answer_id===a.id?'checked':''}
          onchange="selectQuizAnswer('${lessonId}','${q.id}','${a.id}', ${a.correct===true}, ${q.points})" />
        ${a.text}
      </label>`;
    });
    html += `</div>`;
    if (answered){
      html += `<div class="quiz-feedback ${result.is_correct?'ok':'bad'}">${result.is_correct ? '✅ Правильно! +'+result.points_earned+' б.' : '❌ Неправильно'}</div>`;
    }
    html += `</div>`;
  });
  html += '</div>';
  return html;
}
function renderContentBlocks(blocks, lessonId){
  if (!blocks || !blocks.length) return '';
  return blocks.map(b => {
    if (b.type === 'text' && b.text) return `<div class="block-text">${b.text}</div>`;
    if (b.type === 'video' && b.url) return renderVideoBlock(b.url);
    if (b.type === 'audio' && b.url) return renderAudioBlock(b.url);
    if (b.type === 'image' && b.url) return `<div class="block-image"><img src="${b.url}" onclick="window.open('${b.url}','_blank')" />${b.caption ? `<div class="caption">${b.caption}</div>` : ''}</div>`;
    if (b.type === 'file' && b.url) return `<div class="block-file"><a href="${b.url}" target="_blank" rel="noopener">📎 ${b.caption || 'Відкрити файл'}</a></div>`;
    if (b.type === 'quiz' && b.questions && b.questions.length) return renderQuizBlock(b, lessonId);
    return '';
  }).join('');
}

async function render(){
  if (!state.user){
    try {
      const saved = JSON.parse(localStorage.getItem(CANDIDATE_KEY) || 'null');
      if (saved && saved.email){ state.user = saved.email; state.userName = saved.name || ''; }
    } catch(e){}
  }
  if (!state.user){
    userBar.style.display = 'none';
    renderLogin();
    return;
  }
  userBar.style.display = 'flex';
  userNameEl.textContent = state.userName ? state.userName : state.user;

  if (!state.departments.length){
    app.innerHTML = '<div class="loading">Завантаження...</div>';
    await loadDepartments();
    await loadProgress();
  }

  if (!state.currentDepartment){
    renderDepartmentList();
  } else if (!state.currentCourse){
    renderCourseList();
  } else {
    renderLessonPage();
  }
}

function renderLogin(){
  app.innerHTML = `
    <div class="login-wrap"><div class="login-card">
      <h1>Вхід у курс</h1>
      <p>Введи своє ім'я та email. Це потрібно лише для того, щоб зберігати твій прогрес — код на пошту не надсилається.</p>
      <input type="text" id="nameInput" placeholder="Повне ім'я" autocomplete="name" />
      <input type="email" id="emailInput" placeholder="Email" autocomplete="email" />
      <button onclick="doLogin()">Почати навчання →</button>
    </div></div>`;
  const nameEl = document.getElementById('nameInput');
  const emailEl = document.getElementById('emailInput');
  nameEl.addEventListener('keydown', e => { if (e.key==='Enter') emailEl.focus(); });
  emailEl.addEventListener('keydown', e => { if (e.key==='Enter') doLogin(); });
  nameEl.focus();
}
function doLogin(){
  const name = document.getElementById('nameInput').value.trim();
  const email = document.getElementById('emailInput').value.trim().toLowerCase();
  if (!name){ alert("Введи, будь ласка, своє ім'я."); return; }
  if (!email || !/^\S+@\S+\.\S+$/.test(email)){ alert('Введи коректний email.'); return; }
  state.user = email;
  state.userName = name;
  try { localStorage.setItem(CANDIDATE_KEY, JSON.stringify({ name, email })); } catch(e){}
  render();
}

// ---------- РІВЕНЬ 1: ВІДДІЛИ ----------

function renderDepartmentList(){
  let html = '';
  state.departments.forEach(d => {
    html += `
      <div class="card-item" onclick="openDepartment('${d.id}')">
        ${d.cover_image ? `<img src="${d.cover_image}" style="width:100%;height:120px;object-fit:cover;border-radius:8px;margin-bottom:10px;" />` : ''}
        <div class="num">Відділ</div>
        <h2>${d.title}</h2>
        <p>${d.description || ''}</p>
      </div>`;
  });
  app.innerHTML = html || '<div class="empty">Курсів поки немає.</div>';
}
async function openDepartment(id){
  state.currentDepartment = id;
  app.innerHTML = '<div class="loading">Завантаження...</div>';
  await loadCourses(id);
  render();
}
function backToDepartments(){
  state.currentDepartment = null;
  render();
}

// ---------- РІВЕНЬ 2: КУРСИ ----------

function courseProgress(courseId){
  const lessons = state.lessons[courseId] || [];
  if (!lessons.length) return {done:0, total:0};
  const done = lessons.filter(l => state.progress[l.id] === 'done').length;
  return {done, total: lessons.length};
}
async function renderCourseList(){
  const dept = state.departments.find(d => d.id === state.currentDepartment);
  const courses = state.courses[state.currentDepartment] || [];
  let html = `<button class="back-link" onclick="backToDepartments()">← Усі відділи</button>
    <div class="crumbs">${dept.title}</div>
    <h1 style="margin-top:0;">Курси</h1>`;
  for (const course of courses){
    await loadLessons(course.id);
    const p = courseProgress(course.id);
    const pct = p.total ? Math.round(p.done / p.total * 100) : 0;
    html += `
      <div class="card-item" onclick="openCourse('${course.id}')">
        ${course.cover_image ? `<img src="${course.cover_image}" style="width:100%;height:120px;object-fit:cover;border-radius:8px;margin-bottom:10px;" />` : ''}
        <div class="num">Курс</div>
        <h2>${course.title}</h2>
        <p>${course.description || ''}</p>
        <div class="progress-bar"><div style="width:${pct}%"></div></div>
        <div class="progress-label">${p.done} з ${p.total} уроків пройдено</div>
      </div>`;
  }
  app.innerHTML = html;
}
async function openCourse(courseId){
  state.currentCourse = courseId;
  state.currentLessonIdx = 0;
  app.innerHTML = '<div class="loading">Завантаження...</div>';
  await loadLessons(courseId);
  renderLessonList();
}
function backToCourses(){
  state.currentCourse = null;
  render();
}

// ---------- РІВЕНЬ 3: УРОКИ ----------

function renderLessonList(){
  const course = (state.courses[state.currentDepartment]||[]).find(c => c.id === state.currentCourse);
  const lessons = state.lessons[state.currentCourse];
  let html = `<button class="back-link" onclick="backToCourses()">← Усі курси</button>
    <h1 style="margin-top:0;">${course.title}</h1>`;
  lessons.forEach((l, idx) => {
    const done = state.progress[l.id] === 'done';
    html += `
      <div class="lesson-row" onclick="openLesson(${idx})">
        <div class="lesson-check ${done ? 'done' : ''}">${done ? '✓' : idx+1}</div>
        <div class="lesson-title">${l.title}</div>
      </div>`;
  });
  app.innerHTML = html;
}
async function openLesson(idx){
  state.currentLessonIdx = idx;
  const lesson = state.lessons[state.currentCourse][idx];
  await loadTasks(lesson.id);
  await loadQuizResults(lesson.id);
  await markLessonStarted(lesson.id);
  renderLessonPage();
}

function renderLessonPage(){
  const lessons = state.lessons[state.currentCourse];
  const idx = state.currentLessonIdx;
  const lesson = lessons[idx];
  const tasks = state.tasks[lesson.id] || [];
  const done = state.progress[lesson.id] === 'done';

  let tasksHtml = '';
  if (tasks.length){
    tasksHtml = '<div class="tasks">' + tasks.map(t => `
      <div class="task ${t.task_type}">
        <span class="tag">${taskTypeLabel(t.task_type)}</span>
        <p>${t.task_text}</p>
        <label>
          <input type="checkbox" ${state.taskDone[t.id] ? 'checked' : ''} onchange="toggleTask('${t.id}', this.checked)" />
          Виконано
        </label>
      </div>`).join('') + '</div>';
  }

  const contentHtml = renderContentBlocks(lesson.content_blocks, lesson.id) ||
    `<div class="block-text">${lesson.transcript_text || lesson.description || 'Контент буде додано пізніше.'}</div>`;

  app.innerHTML = `
    <button class="back-link" onclick="renderLessonList()">← До списку уроків</button>
    <div class="lesson-header">
      <div class="eyebrow">Урок ${idx+1} з ${lessons.length}</div>
      <h1>${lesson.title}</h1>
    </div>
    ${contentHtml}
    ${tasksHtml}
    <div class="lesson-nav">
      <button ${idx === 0 ? 'disabled' : ''} onclick="openLesson(${idx-1})">← Попередній</button>
      ${done
        ? `<button class="primary" ${idx === lessons.length-1 ? 'disabled' : ''} onclick="openLesson(${idx+1})">Наступний →</button>`
        : `<button class="primary" onclick="completeLesson()">Позначити пройденим</button>`}
    </div>`;
}
async function completeLesson(){
  const lesson = state.lessons[state.currentCourse][state.currentLessonIdx];
  await markLessonDone(lesson.id);
  renderLessonPage();
}

render();
</script>
</body>
</html>
